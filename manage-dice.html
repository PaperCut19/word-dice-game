<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Dice</title>
  </head>
  <body class="bg-amber-100">
    <!-- main container -->
    <div class="main-container">
      <h1 class="text-4xl">Manage Your Dice</h1>
      <!-- menu area -->
      <!-- toggle button -->
      <button id="toggleMenuButton" class="button-secondary">
        Toggle Menu
      </button>
      <!-- menu -->
      <div
        id="menu"
        class="flex flex-col items-center justify-center gap-2 border-2 border-red-300 p-4"
      >
        <button class="button-secondary">Create Dice</button>
        <button class="button-secondary">Edit Dice</button>
        <button class="button-secondary">Delete Dice</button>
      </div>

      <!-- create blocks -->
      <div class="flex gap-2">
        <!-- dice block -->
        <div class="flex items-center justify-center">
          <div class="dice-box">
            <h1 class="dice-letter"></h1>
          </div>
        </div>
        <!-- text input -->
        <div class="flex flex-col gap-2">
          <input type="text" class="text-input" />
          <input type="text" class="text-input" />
          <input type="text" class="text-input" />
          <input type="text" class="text-input" />
          <input type="text" class="text-input" />
          <input type="text" class="text-input" />
        </div>
      </div>

      <!-- dice blocks -->
      <div
        id="diceBlockDiv"
        class="flex flex-wrap items-center justify-center gap-3"
      ></div>

      <button id="faceValueButton" class="button-secondary">
        show face values
      </button>
      <!-- website link -->
      <a href="index.html" class="button-primary">Use Your Dice</a>
    </div>

    <script type="module" src="/src/manage-dice.js"></script>
  </body>
</html>
