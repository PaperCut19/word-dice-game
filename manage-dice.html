<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Dice</title>
  </head>
  <body class="bg-amber-100">
    <!-- main container -->
    <div class="main-container">
      <h1 class="text-4xl">Manage Your Dice</h1>

      <!-- menu area -->
      <div
        id="menuArea"
        class="flex flex-col items-center justify-center gap-2"
      >
        <!-- toggle button -->
        <button id="toggleMenuButton" class="button-secondary">
          Toggle Menu
        </button>

        <!-- menu -->
        <div
          class="border-main flex flex-col items-center justify-center gap-2"
          id="menu"
        >
          <button class="button-secondary" id="createDiceButton">
            Create Dice
          </button>
          <button class="button-secondary" id="editDiceButton">
            Edit Dice
          </button>
          <button class="button-secondary" id="deleteDiceButton">
            Delete Dice
          </button>
        </div>
      </div>

      <!-- create dice -->
      <div class="hidden" id="createBlocksDiv">
        <div class="border-main flex flex-col gap-2 md:flex-row">
          <!-- dice block -->

          <div class="flex flex-col items-center justify-center">
            <h1 class="max-w-[100px] wrap-break-word" id="nameOfNewDiceHeader">
              Name:
            </h1>
            <div class="dice-box">
              <h1 class="dice-letter"></h1>
            </div>
          </div>
          <!-- text input -->
          <div class="flex flex-col gap-2 md:ml-5" id="createDiceTextArea">
            <label for="nameOfNewDiceText">Name of Dice</label>
            <input type="text" id="nameOfNewDiceText" class="text-input" />
            <label for="createDiceText1">Side 1</label>
            <input type="text" id="createDiceText1" class="text-input" />
            <label for="createDiceText2">Side 2</label>
            <input type="text" id="createDiceText2" class="text-input" />
            <label for="createDiceText3">Side 3</label>
            <input type="text" id="createDiceText3" class="text-input" />
            <label for="createDiceText4">Side 4</label>
            <input type="text" id="createDiceText4" class="text-input" />
            <label for="createDiceText5">Side 5</label>
            <input type="text" id="createDiceText5" class="text-input" />
            <label for="createDiceText6">Side 6</label>
            <input type="text" id="createDiceText6" class="text-input" />
            <!-- submit button -->
            <button class="button-secondary" id="createDiceSubmit">
              Submit
            </button>
          </div>
        </div>
      </div>

      <!-- delete dice -->
      <div class="hidden" id="deleteDiceArea">
        <div class="border-main">
          <button class="button-secondary" id="deleteAllButton">
            Delete All
          </button>
        </div>
      </div>

      <!-- dice blocks -->
      <div
        id="diceBlockDiv"
        class="flex flex-wrap items-center justify-center gap-3"
      ></div>

      <!-- <button id="faceValueButton" class="button-secondary">
        show face values
      </button> -->
      <!-- website link -->
      <a href="index.html" class="button-primary">home page</a>
    </div>

    <script type="module" src="/src/manage-dice.js"></script>
  </body>
</html>
